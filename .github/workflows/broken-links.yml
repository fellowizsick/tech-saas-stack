name: 🔗 Broken Link Checker
on:
  schedule:
    # Run every Sunday at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken affiliate links
        id: linkcheck
        shell: bash
        run: |
          echo "Checking affiliate links in _posts/..."
          BROKEN=""

          # Extract all http/https links from posts (affiliate + review links)
          grep -rohE 'https?://[^"'"'"'` )>]+' _posts/ | sort -u > /tmp/all-links.txt || true
          TOTAL=$(wc -l < /tmp/all-links.txt)
          echo "Found $TOTAL unique links to check"

          # Check each link (with timeout and redirect following)
          while IFS= read -r url; do
            # Skip common false positives
            [[ "$url" =~ "github.com" ]] && continue
            [[ "$url" =~ "techsaasstack.com" ]] && continue
            [[ "$url" =~ "localhost" ]] && continue

            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 15 -L "$url" 2>/dev/null)
            if [[ "$STATUS" != "200" && "$STATUS" != "301" && "$STATUS" != "302" && "$STATUS" != "403" ]]; then
              BROKEN="${BROKEN}$url → HTTP $STATUS"$'\n'
            fi
          done < /tmp/all-links.txt

          echo "checked=$TOTAL" >> $GITHUB_OUTPUT

          if [[ -n "$BROKEN" ]]; then
            echo "broken=true" >> $GITHUB_OUTPUT
            echo "BROKEN_LINKS<<EOF" >> $GITHUB_OUTPUT
            echo -e "$BROKEN" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "broken=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue if broken links found
        if: steps.linkcheck.outputs.broken == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const brokenLinksOutput = `${{ steps.linkcheck.outputs.BROKEN_LINKS }}`;
            const brokenCount = brokenLinksOutput.split('\n').filter(l => l.trim()).length;
            const body = `## 🔗 Broken Links Found
            A weekly scan of affiliate/review links found the following broken URLs:

            \`\`\`
            ${brokenLinksOutput}
            \`\`\`

            **Total links checked:** ${{ steps.linkcheck.outputs.checked }}
            **Broken links:** ${brokenCount}

            ---
            _Generated by the Broken Link Checker workflow._`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔗 Broken links detected — ${new Date().toISOString().slice(0, 10)}`,
              body: body,
              labels: ['bug', 'automated']
            });

      - name: Report all clear
        if: steps.linkcheck.outputs.broken == 'false'
        run: |
          echo "✅ All ${{ steps.linkcheck.outputs.checked }} links are healthy. No issues created."
