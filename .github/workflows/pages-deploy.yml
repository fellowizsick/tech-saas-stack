name: 🌐 Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to Pages (with retries)
        uses: actions/deploy-pages@v5
        id: deploy
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 10000

      - name: Retry on failure
        if: steps.deploy.outcome != 'success'
        run: |
          echo "First deploy attempt failed. Waiting 30s then retrying..."
          sleep 30

      - name: Second deploy attempt
        if: steps.deploy.outcome != 'success'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 10000

      - name: Third deploy attempt
        if: steps.deploy.outcome != 'success'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 20
          reporting_interval: 10000

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Deploy failed after 3 attempts (60+ retries). GitHub Pages may be experiencing an outage."
