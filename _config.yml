title: Tech & SaaS Stack
tagline: Honest reviews, comparisons, and tutorials
description: Data-driven reviews of web hosting, SaaS tools, and software for developers, creators, and online businesses.
url: "https://techsaasstack.com"
baseurl: ""

# Author — used by Review/Article structured data. Google Review rich results
# require author as a Person with a name (org-only author => "Missing field
# author" warning). 2026-07-12 fix for Search Console review-snippet issue.
author:
  name: "Jon Brown"
  url: "https://techsaasstack.com"
  logo: /assets/images/og-default.png

# Default social/Open Graph image — unblocks Pinterest/social thumbnails for
# ALL posts (was missing -> blank thumbnails -> 0 impressions). 2026-07-11.
og_image: /assets/images/og-default.png
logo: /assets/images/og-default.png

# Current year for dynamic titles (update annually)
current_year: 2026

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-last-modified-at

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

future: true
excerpt_separator: "<!--more-->"
permalink: /:year/:month/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
