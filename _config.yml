title: Tech & SaaS Stack
tagline: Honest reviews, comparisons, and tutorials
description: In-depth, data-driven reviews of web hosting, SaaS tools, and software for developers, creators, and online businesses.
url: "https://techsaasstack.com"
baseurl: ""
author: Jon Brown

# Author profile for social proof
author_profile:
  name: "Jon Brown"
  title: "Tech Reviewer & Affiliate Content Creator"
  bio: "I've spent years testing web hosting, SaaS tools, and WordPress solutions so you don't have to guess — you get honest, data-driven reviews you can trust."
  avatar: "JB"
  credentials:
    - "10+ years WordPress & hosting experience"
    - "Tested 50+ hosting providers hands-on"
    - "Published 100+ in-depth comparisons"
    - "Disabled veteran (PTSD) — building in public"
  social:
    github: "https://github.com/fellowizsick"
    email: "jon.techsaasstack@gmail.com"
    blog: "https://fellowizsick.github.io"
  trust_badges:
    - label: "WP.org Recommended"
      icon: "🏆"
      url: "https://wordpress.org"
    - label: "100+ Providers Tested"
      icon: "✅"
      url: "#"
    - label: "No Sponsored Reviews"
      icon: "🤝"
      url: "#"
    - label: "Data-Driven Analysis"
      icon: "📊"
      url: "#"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-last-modified-at

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: Jon Brown
      toc: true

future: true
permalink: /:year/:month/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
