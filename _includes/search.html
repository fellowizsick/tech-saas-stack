<!-- Search Component (Pagefind - Client-side, no backend) -->
<div class="search-container" id="searchContainer">
  <label for="searchInput" class="search-label">Search articles...</label>
  <div class="search-input-wrapper">
    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="search" id="searchInput" class="search-input" placeholder="Search hosting reviews, guides, comparisons..." autocomplete="off" aria-label="Search articles">
    <button class="search-clear" id="searchClear" aria-label="Clear search" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <div class="search-results" id="searchResults" style="display:none;"></div>
</div>

<script>
// Pagefind search integration
let pagefindSearch = null;

async function initSearch() {
  try {
    // Load Pagefind dynamically
    const module = await import('https://cdn.jsdelivr.net/npm/pagefind@1.1.0/dist/pagefind.es.js');
    pagefindSearch = module;
    await pagefindSearch.init();
    console.log('Pagefind search initialized');
  } catch (e) {
    console.warn('Pagefind not available, using fallback search');
    initFallbackSearch();
  }
}

function initFallbackSearch() {
  // Simple client-side search fallback using page content
  const searchIndex = buildSearchIndex();
  
  document.getElementById('searchInput').addEventListener('input', function(e) {
    const query = e.target.value.trim().toLowerCase();
    const clearBtn = document.getElementById('searchClear');
    const resultsDiv = document.getElementById('searchResults');
    
    if (query.length === 0) {
      resultsDiv.style.display = 'none';
      clearBtn.style.display = 'none';
      return;
    }
    
    clearBtn.style.display = 'flex';
    const results = searchIndex.filter(item => 
      item.title.toLowerCase().includes(query) || 
      item.excerpt.toLowerCase().includes(query) ||
      (item.categories && item.categories.some(c => c.toLowerCase().includes(query)))
    ).slice(0, 10);
    
    if (results.length === 0) {
      resultsDiv.innerHTML = '<div class="search-result-item"><p style="padding:var(--space-unit)*3; color:var(--text-muted);">No results for "' + escapeHtml(query) + '"</p></div>';
    } else {
      resultsDiv.innerHTML = results.map(item => `
        <a href="${item.url}" class="search-result-item">
          <div class="search-result-title">${highlightMatch(item.title, query)}</div>
          <div class="search-result-excerpt">${highlightMatch(item.excerpt.substring(0, 160), query)}...</div>
          <div class="search-result-meta">${item.date} ${item.categories ? '· ' + item.categories.join(', ') : ''}</div>
        </a>
      `).join('');
    }
    resultsDiv.style.display = 'block';
  });
  
  document.getElementById('searchClear').addEventListener('click', function() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').style.display = 'none';
    this.style.display = 'none';
    document.getElementById('searchInput').focus();
  });
}

function buildSearchIndex() {
  // Extract from existing post cards on page
  const cards = document.querySelectorAll('.post-card');
  const index = [];
  cards.forEach(card => {
    const link = card.querySelector('h2 a');
    const meta = card.querySelector('.post-meta');
    const excerpt = card.querySelector('p');
    const categories = card.getAttribute('data-categories');
    if (link) {
      index.push({
        title: link.textContent.trim(),
        url: link.href,
        excerpt: excerpt ? excerpt.textContent.trim() : '',
        date: meta ? meta.textContent.trim().split('📂')[0].replace('📅', '').trim() : '',
        categories: categories ? categories.split(',').map(c => c.trim()) : []
      });
    }
  });
  return index;
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const regex = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
  return escapeHtml(text).replace(regex, '<mark>$1</mark>');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Initialize search on DOM ready
document.addEventListener('DOMContentLoaded', function() {
  // Try Pagefind first, fallback to simple search
  if (typeof pagefind !== 'undefined') {
    initSearch();
  } else {
    // Check if we're on a page with post cards
    if (document.querySelector('.post-card')) {
      initFallbackSearch();
    }
  }
});
</script>
