<!DOCTYPE html>
<html>
<head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f0f15; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.cover { width: 1280px; height: 720px; background: linear-gradient(135deg, #0f0f15 0%, #1a1a2e 50%, #16213e 100%); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.cover::before { content: ''; position: absolute; top: -150px; right: -150px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%); border-radius: 50%; }
.cover::after { content: ''; position: absolute; bottom: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(245,158,11,0.1) 0%, transparent 70%); border-radius: 50%; }
.badge { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; padding: 8px 24px; border-radius: 100px; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 24px; position: relative; z-index: 1; }
h1 { color: #fff; font-size: 52px; font-weight: 800; text-align: center; line-height: 1.2; margin-bottom: 12px; position: relative; z-index: 1; }
h1 span { background: linear-gradient(135deg, #6366f1, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.sub { color: rgba(255,255,255,0.6); font-size: 20px; text-align: center; margin-bottom: 32px; position: relative; z-index: 1; }
.price { display: inline-flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); padding: 12px 28px; border-radius: 100px; position: relative; z-index: 1; }
.price span { color: #fff; font-size: 28px; font-weight: 700; }
.price small { color: rgba(255,255,255,0.5); font-size: 14px; }
.tagline { position: absolute; bottom: 30px; color: rgba(255,255,255,0.25); font-size: 13px; letter-spacing: 0.05em; z-index: 1; }
.dots { position: absolute; top: 40px; right: 60px; display: grid; grid-template-columns: repeat(3, 6px); gap: 8px; z-index: 1; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(99,102,241,0.3); }
.line { position: absolute; left: 0; right: 0; bottom: 80px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); }
</style></head>
<body>
<div class="cover">
  <div class="dots"> <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div> </div>
  <div class="badge">📈 Digital Product</div>
  <h1>Affiliate Marketing<br><span>Starter Kit</span></h1>
  <p class="sub">Content Engine · SEO Framework · Affiliate Playbook</p>
  <div class="price"><span>$17</span><small>one-time · instant download</small></div>
  <div class="line"></div>
  <p class="tagline">Tech &amp; SaaS Stack  © 2026</p>
</div>
</body></html>
