<!DOCTYPE html>
<html><body style="margin:0;padding:0;overflow:hidden;width:100vw;height:100vw">
<canvas id="c" style="display:block;width:100vw;height:100vw"></canvas>
<script>
var c = document.getElementById('c');
c.width = window.innerWidth;
c.height = window.innerWidth;
var ctx = c.getContext('2d');
var s = c.width;

function r(x,y,w,h,v){ctx.beginPath();ctx.moveTo(x+v,y);ctx.lineTo(x+w-v,y);ctx.quadraticCurveTo(x+w,y,x+w,y+v);ctx.lineTo(x+w,y+h-v);ctx.quadraticCurveTo(x+w,y+h,x+w-v,y+h);ctx.lineTo(x+v,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-v);ctx.lineTo(x,y+v);ctx.quadraticCurveTo(x,y,x+v,y);ctx.closePath()}

var g=ctx.createLinearGradient(0,0,s,s);g.addColorStop(0,'#0f0f15');g.addColorStop(0.5,'#1a1a2e');g.addColorStop(1,'#16213e');ctx.fillStyle=g;ctx.fillRect(0,0,s,s);

var g2=ctx.createRadialGradient(s*0.75,s*0.12,10,s*0.75,s*0.12,s*0.4);g2.addColorStop(0,'rgba(99,102,241,0.15)');g2.addColorStop(1,'rgba(99,102,241,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,s,s);
var g3=ctx.createRadialGradient(s*0.2,s*0.85,10,s*0.2,s*0.85,s*0.35);g3.addColorStop(0,'rgba(245,158,11,0.1)');g3.addColorStop(1,'rgba(245,158,11,0)');ctx.fillStyle=g3;ctx.fillRect(0,0,s,s);

ctx.fillStyle='rgba(99,102,241,0.2)';
var ds=Math.round(s*0.02),dd=Math.round(s*0.012);
[[s*0.86,ds*2],[s*0.86+dd,ds*2],[s*0.86+dd*2,ds*2],[s*0.86,ds*2+dd],[s*0.86+dd,ds*2+dd],[s*0.86+dd*2,ds*2+dd]].forEach(function(p){ctx.beginPath();ctx.arc(p[0],p[1],Math.max(3,s*0.005),0,2*Math.PI);ctx.fill()});

var bg=ctx.createLinearGradient(s*0.35,s*0.15,s*0.65,s*0.22);bg.addColorStop(0,'#6366f1');bg.addColorStop(1,'#8b5cf6');ctx.fillStyle=bg;r(s*0.35,s*0.15,s*0.3,s*0.05,Math.round(s*0.025));ctx.fill();

var fs=Math.round(s*0.062);
ctx.fillStyle='#fff';ctx.font='600 '+Math.round(s*0.018)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('📈 DIGITAL PRODUCT', s*0.5, s*0.175);

var ts=Math.round(s*0.063);
ctx.fillStyle='#fff';ctx.font='800 '+ts+'px sans-serif';
ctx.fillText('Affiliate', s*0.5, s*0.33);
var tg=ctx.createLinearGradient(s*0.25,s*0.4,s*0.75,s*0.48);tg.addColorStop(0,'#818cf8');tg.addColorStop(1,'#a78bfa');ctx.fillStyle=tg;
ctx.fillText('Marketing', s*0.5, s*0.40);
ctx.fillText('Starter Kit', s*0.5, s*0.48);

ctx.fillStyle='rgba(255,255,255,0.06)';r(s*0.27,s*0.55,s*0.46,s*0.07,Math.round(s*0.035));ctx.fill();
ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=Math.max(1,s*0.002);r(s*0.27,s*0.55,s*0.46,s*0.07,Math.round(s*0.035));ctx.stroke();
ctx.fillStyle='#fff';ctx.font='700 '+Math.round(s*0.037)+'px sans-serif';
ctx.fillText('$17', s*0.42, s*0.585);
ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font=Math.round(s*0.02)+'px sans-serif';
ctx.fillText('one-time · instant download', s*0.62, s*0.585);

ctx.fillStyle='rgba(255,255,255,0.12)';ctx.font=Math.round(s*0.017)+'px sans-serif';
ctx.fillText('TECH & SAAS STACK', s*0.5, s*0.95);
document.title = 'SQUARE_THUMB';
</script></body></html>
