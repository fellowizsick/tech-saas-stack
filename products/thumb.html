<!DOCTYPE html>
<html>
<head><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#0f0f15 0%,#1a1a2e 50%,#16213e 100%)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;position:relative;height:100vh}
.glow1{position:absolute;top:-20%;right:-10%;width:60%;height:60%;background:radial-gradient(circle,rgba(99,102,241,0.12) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.glow2{position:absolute;bottom:-15%;left:-10%;width:50%;height:50%;background:radial-gradient(circle,rgba(245,158,11,0.07) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.dots{position:absolute;top:8%;right:10%;display:grid;grid-template-columns:repeat(3,5px);gap:7px;pointer-events:none}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(99,102,241,0.2)}
.badge{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:1.2vh 5vw;border-radius:100px;font-size:min(2.2vh,14px);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:3vh;z-index:1;position:relative}
h1{color:#fff;font-size:min(7vh,42px);font-weight:800;text-align:center;line-height:1.15;z-index:1;position:relative}
h1 span{background:linear-gradient(135deg,#818cf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.price{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);padding:1.5vh 5vw;border-radius:100px;margin-top:3.5vh;z-index:1;position:relative}
.price b{color:#fff;font-size:min(4vh,24px);font-weight:700}
.price small{color:rgba(255,255,255,0.4);font-size:min(1.8vh,11px)}
.ft{position:absolute;bottom:3%;color:rgba(255,255,255,0.12);font-size:min(1.4vh,9px);letter-spacing:1px;z-index:1}
</style></head>
<body>
<div class="glow1"></div>
<div class="glow2"></div>
<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="badge">📈 DIGITAL PRODUCT</div>
<h1>Affiliate<br>Marketing<br><span>Starter Kit</span></h1>
<div class="price"><b>$17</b><small>one-time · instant download</small></div>
<div class="ft">TECH &amp; SAAS STACK</div>
</body></html>
